[project]
name = "bookstore"
version = "0.1.0"
description = "Projeto bookstore"
authors = [
    {name = "Bruno Macedo"}
]
requires-python = ">=3.13"
dependencies = [
    "django (>=5.2,<5.3)",
    "djangorestframework (>=3.18.3,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)"
]
